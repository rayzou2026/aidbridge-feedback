<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AidBridge · Tester Chat 测试群聊</title>
  <style>
    :root { --brand:#2563eb; --brand-dark:#1d4ed8; --bg:#eef2f7; --card:#fff; --text:#1e293b; --muted:#64748b; --border:#dbe2ea; --ok:#16a34a; --danger:#dc2626; }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    .app { max-width:760px; margin:0 auto; height:100vh; display:flex; flex-direction:column; background:var(--bg); }
    /* header */
    .top { background:var(--brand); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .top .brand { font-weight:700; font-size:16px; margin-right:auto; display:inline-flex; align-items:center; gap:7px; }
    .brandlogo { width:28px; height:28px; border-radius:7px; background:#fff; object-fit:contain; padding:1px; }
    .top button, .top select { font-size:13px; border:none; border-radius:8px; padding:7px 10px; cursor:pointer; background:rgba(255,255,255,.18); color:#fff; }
    .top select { background:rgba(255,255,255,.18); }
    .top button:hover { background:rgba(255,255,255,.30); }
    .toggle { display:flex; align-items:center; gap:6px; font-size:13px; }
    .switch { position:relative; width:40px; height:22px; }
    .switch input { display:none; }
    .slider { position:absolute; inset:0; background:rgba(255,255,255,.35); border-radius:999px; transition:.2s; }
    .slider:before { content:''; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
    .switch input:checked + .slider { background:var(--ok); }
    .switch input:checked + .slider:before { transform:translateX(18px); }
    /* messages */
    .msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .welcome { background:#fff; border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:13.5px; color:var(--muted); line-height:1.55; }
    .row { display:flex; gap:8px; max-width:84%; }
    .row.mine { align-self:flex-end; flex-direction:row-reverse; }
    .row.other { align-self:flex-start; }
    .avatar { width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff; }
    .av-ai { background:#7c3aed; } .av-team { background:var(--ok); } .av-tester { background:#0ea5e9; } .av-me { background:var(--brand); }
    .bubble { background:#fff; border:1px solid var(--border); border-radius:14px; padding:8px 11px; font-size:14.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
    .row.mine .bubble { background:#dbeafe; border-color:#bfdbfe; }
    .bubble.ai { background:#f5f3ff; border-color:#ddd6fe; }
    .bubble.team { background:#ecfdf5; border-color:#a7f3d0; }
    .who { font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:2px; }
    .who .tag { font-weight:600; }
    .time { font-size:10.5px; color:#94a3b8; margin-top:3px; }
    .bimg { margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
    .bimg img { width:120px; height:120px; object-fit:cover; border-radius:8px; border:1px solid var(--border); cursor:pointer; }
    .fixed-badge { display:inline-block; background:#dcfce7; color:var(--ok); font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; margin-top:5px; }
    .fixbtn { display:inline-block; margin-top:5px; font-size:11px; color:var(--brand); background:none; border:1px solid var(--border); border-radius:6px; padding:2px 7px; cursor:pointer; }
    .typing { align-self:flex-start; font-size:13px; color:var(--muted); padding:4px 8px; }
    /* input bar */
    .inputbar { background:#fff; border-top:1px solid var(--border); padding:10px; }
    .previews { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .previews .pv { position:relative; width:56px; height:56px; }
    .previews img { width:56px; height:56px; object-fit:cover; border-radius:7px; border:1px solid var(--border); }
    .previews .x { position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:#0009; color:#fff; border:none; cursor:pointer; font-size:12px; line-height:1; }
    .inrow { display:flex; gap:8px; align-items:flex-end; }
    .inrow textarea { flex:1; resize:none; border:1px solid var(--border); border-radius:10px; padding:10px; font-size:15px; font-family:inherit; max-height:120px; }
    .inrow textarea:focus { outline:none; border-color:var(--brand); }
    .iconbtn { background:#f1f5f9; border:1px solid var(--border); border-radius:10px; padding:9px 11px; cursor:pointer; font-size:16px; }
    .sendbtn { background:var(--brand); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; font-size:15px; }
    .sendbtn:disabled { opacity:.5; }
    .hint { font-size:11px; color:var(--muted); margin-top:6px; }
    /* gate / modal */
    .overlay { position:fixed; inset:0; background:#0007; display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
    .modal { background:#fff; border-radius:14px; padding:22px; max-width:420px; width:100%; }
    .modal h2 { margin:0 0 4px; font-size:19px; }
    .modal p { margin:0 0 14px; color:var(--muted); font-size:14px; }
    .modal label { display:block; font-weight:600; font-size:14px; margin:12px 0 6px; }
    .modal input { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:9px; font-size:15px; }
    .modal .btn { width:100%; margin-top:16px; padding:12px; background:var(--brand); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; }
    .modal .link { display:block; text-align:center; margin-top:12px; color:var(--brand); font-size:13px; cursor:pointer; background:none; border:none; width:100%; }
    .modal .err { display:none; margin-top:10px; background:#fef2f2; color:var(--danger); border:1px solid #fecaca; border-radius:8px; padding:9px 11px; font-size:13px; }
    .modal .err.show { display:block; }
    /* lightbox */
    .lb { position:fixed; inset:0; background:#000c; display:none; align-items:center; justify-content:center; z-index:60; }
    .lb.show { display:flex; }
    .lb img { max-width:94%; max-height:94%; border-radius:8px; }
    /* faq panel */
    .faq-ov { position:fixed; inset:0; background:#0007; z-index:55; display:none; align-items:flex-end; justify-content:center; }
    .faq-ov.show { display:flex; }
    .faq-panel { background:#fff; width:100%; max-width:560px; max-height:82vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; overflow:hidden; }
    @media(min-width:600px){ .faq-ov{ align-items:center;} .faq-panel{ border-radius:16px; } }
    .faq-head { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .faq-head h3 { margin:0; font-size:16px; }
    .faq-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); }
    .faq-search { padding:12px 18px; border-bottom:1px solid var(--border); }
    .faq-search input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:9px; font-size:15px; }
    .faq-list { overflow-y:auto; padding:6px 0; }
    .faq-item { border-bottom:1px solid #f1f5f9; }
    .faq-q { width:100%; text-align:left; background:none; border:none; padding:12px 18px; font-size:14.5px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; gap:10px; }
    .faq-q:hover { background:#f8fafc; }
    .faq-a { display:none; padding:0 18px 13px; color:#334155; font-size:13.5px; white-space:pre-wrap; line-height:1.6; }
    .faq-item.open .faq-a { display:block; }
    .faq-empty { padding:20px; text-align:center; color:var(--muted); font-size:13.5px; }
    .faq-ask { border-top:1px solid var(--border); padding:12px 18px 16px; }
    .faq-ask-label { font-size:13px; font-weight:700; color:var(--muted); margin-bottom:8px; }
    .faq-ask-thread { display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
    .faq-ask-thread .qa { font-size:13.5px; border-radius:9px; padding:8px 11px; white-space:pre-wrap; line-height:1.55; }
    .faq-ask-thread .qa.you { background:#dbeafe; align-self:flex-end; max-width:90%; }
    .faq-ask-thread .qa.ai { background:#f5f3ff; border:1px solid #ddd6fe; color:#3730a3; align-self:flex-start; max-width:95%; }
    .faq-ask-row { display:flex; gap:8px; }
    .faq-ask-row input { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:9px; font-size:14.5px; }
    .faq-ask-row button { background:var(--brand); color:#fff; border:none; border-radius:9px; padding:9px 16px; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <span class="brand"><img class="brandlogo" src="https://setbceatrzvznttmleii.supabase.co/storage/v1/object/public/chat-shots/logo.jpg" alt="AidBridge" /> AidBridge</span>
      <span class="toggle" id="aiToggleWrap" style="display:none;">
        <span id="aiToggleLabel">AI</span>
        <label class="switch"><input type="checkbox" id="aiToggle" /><span class="slider"></span></label>
      </span>
      <select id="langSel" title="language">
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="my">မြန်မာ</option>
      </select>
      <button id="faqBtn">❓ <span data-t="faq">Help</span></button>
      <button id="teamBtn"><span data-t="teamIn">Team</span></button>
    </div>

    <div class="msgs" id="msgs"></div>

    <div class="inputbar">
      <div class="previews" id="previews"></div>
      <div class="inrow">
        <button class="iconbtn" id="photoBtn" title="photo">📎</button>
        <button class="iconbtn" id="camBtn" title="camera">📷</button>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
        <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none" />
        <textarea id="input" rows="1" data-tph="msgPh" placeholder="Type a message…"></textarea>
        <button class="sendbtn" id="sendBtn" data-t="send">Send</button>
      </div>
      <div class="hint" data-t="attachHint">Attach / paste / take a photo · everyone in the group sees this chat</div>
    </div>
  </div>

  <!-- name gate -->
  <div class="overlay" id="gate">
    <div class="modal">
      <h2 data-t="joinTitle">Join the tester chat</h2>
      <p data-t="joinSub">Enter your name to start. No account needed.</p>
      <label data-t="yourName">Your name</label>
      <input type="text" id="gateName" placeholder="e.g. Josh" />
      <button class="btn" id="gateBtn" data-t="join">Join chat</button>
    </div>
  </div>

  <!-- team login -->
  <div class="overlay" id="loginModal" style="display:none;">
    <div class="modal">
      <h2 data-t="loginTitle">Team sign in</h2>
      <p data-t="loginSub">For staff only — unlocks team replies, "mark fixed", and the AI switch.</p>
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username" />
      <label data-t="password">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" />
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn" data-t="login">Sign in</button>
      <button class="link" id="loginCancel" data-t="cancel">Cancel</button>
    </div>
  </div>

  <!-- faq -->
  <div class="faq-ov" id="faqOv">
    <div class="faq-panel">
      <div class="faq-head"><h3 data-t="faqTitle">Help / FAQ</h3><button class="faq-close" id="faqClose">×</button></div>
      <div class="faq-search"><input type="text" id="faqSearch" data-tph="faqSearchPh" placeholder="Type your question…" /></div>
      <div class="faq-list" id="faqList"></div>
      <div class="faq-ask">
        <div class="faq-ask-label" data-t="askLabel">Not listed? Ask the AI 👇</div>
        <div class="faq-ask-thread" id="faqAskThread"></div>
        <div class="faq-ask-row">
          <input type="text" id="faqAskInput" data-tph="askPh" placeholder="Ask anything about the platform…" />
          <button id="faqAskBtn" data-t="ask">Ask</button>
        </div>
      </div>
    </div>
  </div>

  <div class="lb" id="lb"><img id="lbImg" src="" alt="" /></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://setbceatrzvznttmleii.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_5RrkzfW_tUjAItrIjBVFCQ_ksZ6jkpc'
    const BUCKET = 'chat-shots'
    const AI_ENGINE_READY = false  // Phase 2 翻成 true / set true once the AI function is deployed
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    // ---------- i18n ----------
    const T = {
      en: { faq:'Help', teamIn:'Team', signOut:'Sign out', send:'Send', msgPh:'Type a message…',
        attachHint:'Attach / paste / take a photo · everyone in the group sees this chat',
        joinTitle:'Join the tester chat', joinSub:'Enter your name to start. No account needed.', yourName:'Your name', join:'Join chat',
        loginTitle:'Team sign in', loginSub:'For staff only — unlocks team replies, "mark fixed", and the AI switch.', password:'Password', login:'Sign in', cancel:'Cancel',
        faqTitle:'Help / FAQ', faqSearchPh:'Type your question…', aiOn:'AI auto-reply: ON', aiOff:'AI auto-reply: OFF',
        you:'You', team:'team', tester:'tester', aiName:'AI', markFixed:'Mark fixed', fixed:'✅ Fixed', aiTyping:'🤖 AI is typing…', nameNeeded:'Please enter your name', loginFail:'Sign-in failed',
        askLabel:'Not listed? Ask the AI 👇', askPh:'Ask anything about the platform…', ask:'Ask', askSetup:'🤖 The AI assistant is being switched on. For now, please ask in the group chat and we will answer you there.',
        welcome:"👋 Welcome! Post your questions or issues here, with screenshots. The 🤖 AI answers automatically; our team also replies in person. Everyone in the group can see and reply." },
      zh: { faq:'帮助', teamIn:'团队', signOut:'退出', send:'发送', msgPh:'输入消息…',
        attachHint:'可附图/粘贴/拍照 · 群内所有人都能看到', joinTitle:'加入测试群聊', joinSub:'填名字即可开始，无需账号。', yourName:'你的名字', join:'进入群聊',
        loginTitle:'团队登录', loginSub:'仅限员工 — 解锁团队回复、标记已修复、AI 开关。', password:'密码', login:'登录', cancel:'取消',
        faqTitle:'帮助 / 常见问题', faqSearchPh:'输入你的问题…', aiOn:'AI 自动回复：开', aiOff:'AI 自动回复：关',
        you:'你', team:'团队', tester:'测试者', aiName:'AI', markFixed:'标记已修复', fixed:'✅ 已修复', aiTyping:'🤖 AI 正在输入…', nameNeeded:'请先填写名字', loginFail:'登录失败',
        askLabel:'没找到？直接问 AI 👇', askPh:'关于平台，随便问…', ask:'提问', askSetup:'🤖 AI 助手正在开通中。暂时请在群聊里提问，我们会在那里回答你。',
        welcome:'👋 欢迎！在这里发你的问题或反馈，可以附截图。🤖 AI 会自动回复；我们团队也会真人回复。群里所有人都能看到并互相回复。' },
      my: { faq:'အကူအညီ', teamIn:'အဖွဲ့', signOut:'ထွက်မည်', send:'ပို့မည်', msgPh:'စာရိုက်ပါ…',
        attachHint:'ဓာတ်ပုံတွဲ/ကူးထည့်/ရိုက်နိုင် · အဖွဲ့အားလုံးမြင်ရသည်', joinTitle:'စမ်းသပ်သူ ချတ်ထဲဝင်ပါ', joinSub:'အမည်ထည့်၍ စတင်ပါ။ အကောင့်မလို။', yourName:'သင့်အမည်', join:'ချတ်ဝင်ရန်',
        loginTitle:'အဖွဲ့ဝင်ရောက်ရန်', loginSub:'ဝန်ထမ်းသီးသန့် — အဖွဲ့ဖြေ၊ ပြင်ပြီးမှတ်၊ AI ခလုတ်ကို ဖွင့်ပေးသည်။', password:'စကားဝှက်', login:'ဝင်မည်', cancel:'မလုပ်တော့',
        faqTitle:'အကူအညီ / မေးလေ့ရှိသော', faqSearchPh:'မေးခွန်းရိုက်ပါ…', aiOn:'AI အလိုအလျောက်ဖြေ - ဖွင့်', aiOff:'AI အလိုအလျောက်ဖြေ - ပိတ်',
        you:'သင်', team:'အဖွဲ့', tester:'စမ်းသပ်သူ', aiName:'AI', markFixed:'ပြင်ပြီးမှတ်', fixed:'✅ ပြင်ပြီး', aiTyping:'🤖 AI ရေးနေသည်…', nameNeeded:'အမည်ထည့်ပါ', loginFail:'ဝင်ရောက်မှု မအောင်မြင်',
        askLabel:'မတွေ့ဘူးလား? AI ကိုမေးပါ 👇', askPh:'ပလပ်ဖောင်းအကြောင်း မေးပါ…', ask:'မေးမည်', askSetup:'🤖 AI ကို ဖွင့်နေဆဲ။ ယခု အဖွဲ့ချတ်တွင် မေးပါ၊ ထိုနေရာမှ ဖြေပါမည်။',
        welcome:'👋 ကြိုဆိုပါသည်။ မေးခွန်း/ပြဿနာများကို ဖန်သားပြင်ဓာတ်ပုံနှင့်တကွ ဤနေရာတွင်တင်ပါ။ 🤖 AI က အလိုအလျောက်ဖြေသည်၊ အဖွဲ့ကလည်း ကိုယ်တိုင်ဖြေသည်။ အဖွဲ့အားလုံး မြင်ပြီး ပြန်ဖြေနိုင်သည်။' }
    }
    let lang = localStorage.getItem('chat_lang') || 'en'
    function t(k) { return (T[lang] && T[lang][k]) || T.en[k] || k }
    function applyLang() {
      document.documentElement.lang = lang
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.getAttribute('data-t')) })
      document.querySelectorAll('[data-tph]').forEach(el => { el.placeholder = t(el.getAttribute('data-tph')) })
      document.getElementById('langSel').value = lang
      updateAiLabel()
      renderFaq(document.getElementById('faqSearch').value)
      render(true)
    }

    // ---------- identity ----------
    let me = { name: localStorage.getItem('chat_name') || '', type: 'tester' }
    let aiEnabled = true

    async function refreshAuth() {
      const { data } = await sb.auth.getSession()
      me.type = data.session ? 'team' : 'tester'
      document.getElementById('aiToggleWrap').style.display = data.session ? 'flex' : 'none'
      document.getElementById('teamBtn').textContent = data.session ? t('signOut') : t('teamIn')
    }

    // ---------- chat ----------
    let chosen = []
    let lastSig = ''
    const msgsEl = document.getElementById('msgs')

    function fmtTime(iso){ return iso ? String(iso).replace('T',' ').slice(11,16) : '' }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
    function pubUrl(p){ return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${p}` }
    function initials(n){ return (n||'?').trim().slice(0,2).toUpperCase() }
    function isMine(m){ return m.author===me.type && (m.author_name||'')===(me.name||'') }

    let cache = []
    async function poll() {
      const { data, error } = await sb.from('chat_messages').select('*').order('created_at',{ascending:true})
      if (error || !data) return
      const sig = data.length + ':' + (data.length ? data[data.length-1].id + ':' + data.filter(m=>m.fixed).length : '')
      if (sig === lastSig) return
      lastSig = sig; cache = data; render()
    }

    function render(forceScroll) {
      const atBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 80
      msgsEl.innerHTML = ''
      const w = document.createElement('div'); w.className='welcome'; w.textContent = t('welcome'); msgsEl.appendChild(w)
      for (const m of cache) {
        const mine = isMine(m)
        const row = document.createElement('div'); row.className = 'row ' + (mine ? 'mine' : 'other')
        const av = document.createElement('div')
        const avc = m.author==='ai'?'av-ai':(m.author==='team'?'av-team':(mine?'av-me':'av-tester'))
        av.className = 'avatar ' + avc
        av.textContent = m.author==='ai' ? '🤖' : initials(m.author_name)
        const wrap = document.createElement('div')
        const who = document.createElement('div'); who.className='who'
        const tag = m.author==='ai' ? '🤖 '+t('aiName') : (m.author==='team' ? '🧑 '+esc(m.author_name||'')+' ('+t('team')+')' : esc(m.author_name||'')+(mine?' ('+t('you')+')':''))
        who.innerHTML = tag
        const b = document.createElement('div'); b.className = 'bubble ' + (m.author==='ai'?'ai':(m.author==='team'?'team':''))
        if (m.body) b.textContent = m.body
        if (Array.isArray(m.images) && m.images.length) {
          const ig = document.createElement('div'); ig.className='bimg'
          m.images.forEach(p=>{ const im=document.createElement('img'); im.src=pubUrl(p); im.onclick=()=>openLb(pubUrl(p)); ig.appendChild(im) })
          b.appendChild(ig)
        }
        const tm = document.createElement('div'); tm.className='time'; tm.textContent = fmtTime(m.created_at)
        b.appendChild(tm)
        // fixed badge / button (only on tester messages)
        if (m.author==='tester') {
          if (m.fixed) { const fb=document.createElement('span'); fb.className='fixed-badge'; fb.textContent=t('fixed'); b.appendChild(document.createElement('br')); b.appendChild(fb) }
          else if (me.type==='team') { const btn=document.createElement('button'); btn.className='fixbtn'; btn.textContent=t('markFixed'); btn.onclick=()=>markFixed(m.id); b.appendChild(document.createElement('br')); b.appendChild(btn) }
        }
        wrap.appendChild(who); wrap.appendChild(b)
        row.appendChild(av); row.appendChild(wrap)
        msgsEl.appendChild(row)
      }
      if (atBottom || forceScroll) msgsEl.scrollTop = msgsEl.scrollHeight
    }

    async function markFixed(id) {
      const { error } = await sb.from('chat_messages').update({ fixed:true }).eq('id', id)
      if (!error) { lastSig=''; poll() }
    }

    function showTyping() {
      if (document.getElementById('typingEl')) return
      const d=document.createElement('div'); d.id='typingEl'; d.className='typing'; d.textContent=t('aiTyping'); msgsEl.appendChild(d); msgsEl.scrollTop=msgsEl.scrollHeight
    }
    function hideTyping(){ const e=document.getElementById('typingEl'); if(e) e.remove() }

    async function send() {
      const body = document.getElementById('input').value.trim()
      if (!body && !chosen.length) return
      if (!me.name) { openGate(); return }
      const btn = document.getElementById('sendBtn'); btn.disabled = true
      try {
        const paths = []
        for (let i=0;i<chosen.length;i++){
          const f=chosen[i]; const ext=(f.name&&f.name.includes('.'))?f.name.split('.').pop().toLowerCase():'png'
          const path = `${Date.now()}_${i}_${Math.floor(Math.random()*1e4)}.${ext}`.replace(/\s/g,'')
          const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType:f.type||'image/png', upsert:false })
          if (error) throw error
          paths.push(path)
        }
        const { error: e2 } = await sb.from('chat_messages').insert({ author: me.type, author_name: me.name, body: body||null, images: paths.length?paths:null })
        if (e2) throw e2
        document.getElementById('input').value=''; chosen=[]; renderPreviews()
        lastSig=''; await poll()
        // Phase 2: trigger AI auto-reply for tester messages
        if (AI_ENGINE_READY && me.type==='tester' && aiEnabled) { showTyping(); try { await fetch(`${SUPABASE_URL}/functions/v1/ai-reply`, {method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}, body: JSON.stringify({ body, images: paths })}) } catch(e){} hideTyping(); lastSig=''; poll() }
      } catch(e) { alert('Send failed: '+(e.message||e)) }
      finally { btn.disabled=false }
    }

    // ---------- images ----------
    function renderPreviews(){
      const c=document.getElementById('previews'); c.innerHTML=''
      chosen.forEach((f,i)=>{ const d=document.createElement('div'); d.className='pv'; const im=document.createElement('img'); im.src=URL.createObjectURL(f); const x=document.createElement('button'); x.className='x'; x.textContent='×'; x.onclick=()=>{chosen.splice(i,1); renderPreviews()}; d.appendChild(im); d.appendChild(x); c.appendChild(d) })
    }
    function addFiles(list){ for(const f of list){ if(f.type&&f.type.startsWith('image/')) chosen.push(f) } if(chosen.length>10) chosen=chosen.slice(0,10); renderPreviews() }
    document.getElementById('photoBtn').onclick=()=>document.getElementById('fileInput').click()
    document.getElementById('camBtn').onclick=()=>document.getElementById('camInput').click()
    document.getElementById('fileInput').onchange=e=>{addFiles(e.target.files); e.target.value=''}
    document.getElementById('camInput').onchange=e=>{addFiles(e.target.files); e.target.value=''}
    document.addEventListener('paste',e=>{ const items=(e.clipboardData&&e.clipboardData.items)||[]; const imgs=[]; for(const it of items){ if(it.type&&it.type.startsWith('image/')){ const f=it.getAsFile(); if(f) imgs.push(f) } } if(imgs.length) addFiles(imgs) })

    // ---------- lightbox ----------
    function openLb(src){ document.getElementById('lbImg').src=src; document.getElementById('lb').classList.add('show') }
    document.getElementById('lb').onclick=()=>document.getElementById('lb').classList.remove('show')

    // ---------- input behaviors ----------
    const inputEl=document.getElementById('input')
    inputEl.addEventListener('input',()=>{ inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,120)+'px' })
    inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send() } })
    document.getElementById('sendBtn').onclick=send

    // ---------- gate ----------
    function openGate(){ document.getElementById('gate').style.display='flex'; document.getElementById('gateName').value=me.name||'' }
    function closeGate(){ document.getElementById('gate').style.display='none' }
    document.getElementById('gateBtn').onclick=()=>{ const n=document.getElementById('gateName').value.trim(); if(!n){ document.getElementById('gateName').focus(); return } me.name=n; localStorage.setItem('chat_name',n); closeGate() }

    // ---------- team login ----------
    document.getElementById('teamBtn').onclick=async()=>{ const {data}=await sb.auth.getSession(); if(data.session){ await sb.auth.signOut(); await refreshAuth(); render(true) } else { document.getElementById('loginModal').style.display='flex' } }
    document.getElementById('loginCancel').onclick=()=>document.getElementById('loginModal').style.display='none'
    document.getElementById('loginBtn').onclick=async()=>{
      const email=document.getElementById('loginEmail').value.trim(), password=document.getElementById('loginPass').value
      const errEl=document.getElementById('loginErr'); errEl.classList.remove('show')
      const { error }=await sb.auth.signInWithPassword({email,password})
      if(error){ errEl.textContent=t('loginFail')+': '+error.message; errEl.classList.add('show'); return }
      document.getElementById('loginModal').style.display='none'
      await refreshAuth(); await loadSettings(); render(true)
    }

    // ---------- AI toggle ----------
    const aiToggle=document.getElementById('aiToggle')
    function updateAiLabel(){ document.getElementById('aiToggleLabel').textContent = aiEnabled ? t('aiOn') : t('aiOff') }
    async function loadSettings(){ const {data}=await sb.from('chat_settings').select('ai_enabled').eq('id',1).maybeSingle(); if(data){ aiEnabled=!!data.ai_enabled; aiToggle.checked=aiEnabled; updateAiLabel() } }
    aiToggle.onchange=async()=>{ aiEnabled=aiToggle.checked; updateAiLabel(); await sb.from('chat_settings').update({ai_enabled:aiEnabled}).eq('id',1) }

    // ---------- FAQ (platform guide) ----------
    const FAQ = [
      { q:`AidBridge 是什么？ / What is AidBridge?`, a:`AidBridge（爱心桥）连接缅甸境外捐赠者与境内受助机构。只做信息与撮合，不经手钱款或物资；捐赠在你和机构间直接进行，平台记录物流单号与签收照片，全程可追踪。\nAidBridge connects donors outside Myanmar with receiving organizations inside. It only matches and informs — it never handles money or goods; donations happen directly, and tracking numbers + delivery photos keep it traceable.`, k:`about what aidbridge 是什么 平台 爱心桥` },
      { q:`AidBridge 会收我的钱吗？ / Does AidBridge take my money?`, a:`不会。平台不收款、不碰物资，你直接和机构对接捐赠。\nNo. It never collects money or handles goods; you donate directly with the organization.`, k:`money donation pay 钱 捐款 收款` },
      { q:`怎么找到需要帮助的人？ / How do I find who needs help?`, a:`在"需求 / Needs"页浏览经审核的真实需求，点进去看详情（需登录）。\nBrowse the "Needs" page for reviewed real needs; tap one for details (sign-in required).`, k:`needs find help 需求 帮助` },
      { q:`浏览或捐赠需要账号吗？ / Do I need an account?`, a:`看大部分页面不用。看需求详情或开始捐赠要登录；捐赠者可自行注册。\nMost browsing needs no account. Seeing a need's details or donating needs sign-in; donors can self-register.`, k:`account login register 账号 登录 注册` },
      { q:`怎么确认帮助送到了？ / How do I know my help arrived?`, a:`①"追踪/Track"页输入物流单号看每一步；②"展示/Showcase"页有机构收到后的照片和感谢。\n1) the Track page (enter a tracking ref); 2) the Showcase page (photos + thanks after delivery).`, k:`track arrived proof 追踪 送到 展示` },
      { q:`机构可靠吗？ / Are the organizations trustworthy?`, a:`每个机构、需求、捐赠、反馈都经人工审核才公开。\nEvery org, need, donation and feedback passes human review before going public.`, k:`trust verify review 可靠 审核` },
      { q:`捐赠流程是怎样的？ / How does donating work?`, a:`①找需求 →②结算确认承诺(不在平台付款) →③平台对接机构直接安排 →④物资经中转点运送、可追踪 →⑤机构收到发照片致谢。\n1) find a need; 2) confirm a pledge at checkout (no payment taken); 3) connect with the org directly; 4) goods ship via transit points, tracked; 5) org posts photo + thanks.`, k:`how donate process 流程 捐赠 步骤` },
      { q:`"结算"会扣款吗？ / Does checkout charge me?`, a:`不会。只是确认你想支持的需求并对接机构。\nNo. It only confirms what you want to support and connects you with the org.`, k:`checkout pay charge 结算 扣款` },
      { q:`平台支持哪些语言？ / What languages?`, a:`英文、中文、缅甸文，完全对等。\nEnglish, Chinese, Burmese — fully equivalent.`, k:`language 语言 中文 英文 缅甸` },
      { q:`我的信息安全吗？ / Is my data safe?`, a:`不出售用户数据；AidBridge 只是撮合方，从不作为捐赠当事一方。\nUser data is not sold; AidBridge is only a matchmaker, never a party to the donation.`, k:`privacy data 隐私 安全` },
      { q:`AidBridge 是 App 还是网站？ / Is AidBridge an app or a website?`, a:`是网站，手机和电脑浏览器都能用，不用安装。\nIt is a website — works in phone and computer browsers, nothing to install.`, k:`app website install 网站 安装 手机` },
      { q:`怎么切换语言？ / How do I switch the language?`, a:`用页面顶部的语言选择（英文 / 中文 / 缅甸文）。\nUse the language switcher at the top of the page (English / 中文 / Burmese).`, k:`language switch 语言 切换 中文 英文 缅甸` },
      { q:`机构收到物资后会怎样？ / What does an organization do after receiving aid?`, a:`机构会发一张照片和感谢，经审核后出现在"展示 / Showcase"页。\nThe organization posts a photo and a thank-you; after review it appears on the Showcase page.`, k:`organization received showcase thanks 机构 收到 展示 感谢` },
      { q:`"新闻 / News"页是什么？ / What is the News page?`, a:`AidBridge 团队的公告、合作和一线报道。\nAnnouncements, partnerships, and field reports from the AidBridge team.`, k:`news blog announcements 新闻 公告 博客` },
      { q:`关注机构后会怎样？ / What happens when I follow an organization?`, a:`你会收到该机构的最新动态。\nYou get that organization's latest updates.`, k:`follow updates organization 关注 动态 机构` },
      { q:`能把需求收藏起来以后再捐吗？ / Can I save a need for later?`, a:`可以，在"收藏 / Saved"里收藏，之后再处理。\nYes — bookmark it under "Saved" and act on it later.`, k:`save bookmark saved later 收藏 保存 以后` },
      { q:`我的捐赠记录在哪看？ / Where can I see my past contributions?`, a:`登录后在"历史 / History"里查看。\nAfter signing in, see them under "History".`, k:`history past contributions 历史 记录 捐赠` },
      { q:`我能直接联系机构吗？ / Can I contact the organization directly?`, a:`可以，AidBridge 会把你和机构对接，由你们直接安排捐赠。\nYes — AidBridge connects you with the organization to arrange the donation directly.`, k:`contact organization directly 联系 机构 直接` },
      { q:`有收据或退税吗？ / Is there a receipt or tax deduction?`, a:`AidBridge 不经手钱款，所以不开收据；你是直接捐给机构的，收据请向机构询问。\nAidBridge does not handle money, so it issues no receipts; since you donate directly, ask the organization about a receipt.`, k:`receipt tax deduction 收据 退税 发票` }
    ]
    const faqList=document.getElementById('faqList')
    function renderFaq(filter){
      const f=(filter||'').trim().toLowerCase(); let items=FAQ
      if(f){ const w=f.split(/\s+/).filter(Boolean); items=FAQ.map(it=>{const hay=(it.q+' '+it.a+' '+(it.k||'')).toLowerCase(); let s=0; for(const x of w) if(hay.includes(x)) s++; return {it,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.it) }
      if(!items.length){ faqList.innerHTML='<div class="faq-empty">没找到 — 直接在群里问吧。/ No match — just ask in the chat.</div>'; return }
      faqList.innerHTML=''
      items.forEach(it=>{ const d=document.createElement('div'); d.className='faq-item'; const b=document.createElement('button'); b.className='faq-q'; b.type='button'; const q=document.createElement('span'); q.textContent=it.q; const p=document.createElement('span'); p.textContent='＋'; b.appendChild(q); b.appendChild(p); const a=document.createElement('div'); a.className='faq-a'; a.textContent=it.a; b.onclick=()=>{d.classList.toggle('open'); p.textContent=d.classList.contains('open')?'－':'＋'}; d.appendChild(b); d.appendChild(a); faqList.appendChild(d) })
    }
    document.getElementById('faqBtn').onclick=()=>document.getElementById('faqOv').classList.add('show')
    document.getElementById('faqClose').onclick=()=>document.getElementById('faqOv').classList.remove('show')
    document.getElementById('faqOv').onclick=e=>{ if(e.target.id==='faqOv') document.getElementById('faqOv').classList.remove('show') }
    document.getElementById('faqSearch').addEventListener('input',e=>renderFaq(e.target.value))

    // ---------- Ask the AI (for questions not in the list) ----------
    const faqAskThread=document.getElementById('faqAskThread')
    function addQA(cls,text){ const d=document.createElement('div'); d.className='qa '+cls; d.textContent=text; faqAskThread.appendChild(d); d.scrollIntoView({block:'nearest'}) }
    async function askAI(){
      const inp=document.getElementById('faqAskInput'); const q=inp.value.trim(); if(!q) return
      addQA('you', q); inp.value=''
      if(!AI_ENGINE_READY){ addQA('ai', t('askSetup')); return }
      const btn=document.getElementById('faqAskBtn'); btn.disabled=true; const old=btn.textContent; btn.textContent='…'
      try{
        const r=await fetch(`${SUPABASE_URL}/functions/v1/ai-ask`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},body:JSON.stringify({question:q,lang})})
        const j=await r.json(); addQA('ai', (j&&j.answer)||t('askSetup'))
      }catch(e){ addQA('ai', t('askSetup')) }
      finally{ btn.disabled=false; btn.textContent=old }
    }
    document.getElementById('faqAskBtn').onclick=askAI
    document.getElementById('faqAskInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); askAI() } })

    // ---------- language ----------
    document.getElementById('langSel').onchange=e=>{ lang=e.target.value; localStorage.setItem('chat_lang',lang); applyLang() }

    // ---------- boot ----------
    ;(async function(){
      applyLang()
      renderFaq('')
      await refreshAuth()
      await loadSettings()
      if(!me.name) openGate(); else closeGate()
      await poll()
      setInterval(poll, 3000)
    })()
  </script>
</body>
</html>
